# Free Render apps fall asleep after 15 minutes without visitors and take ~50 seconds to wake.
# During weekday business hours (when recruiters look), ping each demo every 10 minutes so it
# stays awake. 9am-6pm ET keeps all three within Render's 750 free hours a month.
name: Keep demos warm

on:
  schedule:
    - cron: "*/10 13-21 * * 1-5" # 9:00-5:59pm ET (UTC-4)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for url in https://bevbnb-la31.onrender.com/api/spots https://be-leaf.onrender.com/api/plants https://discordia-nmgn.onrender.com/; do
            curl -s -o /dev/null -w "%{http_code} $url\n" --max-time 90 "$url" || true
          done
